<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title>
<script>
  // The AI Brief moved to ai.mediancanadian.ca (November 12, 2026). Old links (sjvadrevu.github.io/ai-brief/...,
  // which GitHub forwards to vadrevu.ca/ai-brief/...) land here and go on to the same page there.
  (function () {
    var p = location.pathname;
    if (p === '/ai-brief' || p.indexOf('/ai-brief/') === 0) {
      location.replace('https://ai.mediancanadian.ca' + (p.slice('/ai-brief'.length) || '/') + location.search + location.hash);
    }
  })();
</script>

  body { font: 16px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; margin: 0; padding: 48px 16px; color: #1a1a1a; background: #fff; }
